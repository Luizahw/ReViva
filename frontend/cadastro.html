<body class="auth-body"><div class="auth-backdrop" aria-hidden="true"></div><main class="auth-layout"><section class="auth-intro"><a class="brand brand-auth" href="index.html"><span class="brand-mark brand-symbol" aria-hidden="true">♻️</span><span>ReViva</span></a><p class="auth-slogan">Recicle o presente, reutilize o futuro.</p><p class="auth-manifesto">Comece uma nova<br>Jornada ReViva.</p><p class="auth-caption">Cada material no destino certo ajuda a construir h&aacute;bitos melhores para todos.</p></section><section class="auth-panel"><div class="auth-panel-top"><a class="back-link" href="index.html">&larr; Entrar</a><button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema"><span data-theme-icon>&#9790;</span></button></div><form class="auth-card" id="registerForm"><div><p class="eyebrow">JUNTE-SE AO CICLO</p><h1>Criar conta</h1><p class="muted">Leva s&oacute; um momento para come&ccedil;ar.</p></div><label class="field"><span>Nome completo</span><input name="nome" autocomplete="name" maxlength="100" placeholder="Como podemos chamar voc&ecirc;?" required></label><label class="field"><span>E-mail</span><input name="email" type="email" autocomplete="email" maxlength="150" placeholder="voce@exemplo.com" required></label><label class="field"><span>Senha</span><span class="password-field"><input name="senha" type="password" autocomplete="new-password" minlength="8" placeholder="M&iacute;nimo de 8 caracteres" required><button class="visibility-toggle" type="button" data-toggle-password aria-label="Mostrar senha">Ver</button></span></label><label class="field"><span>Confirmar senha</span><span class="password-field"><input name="confirmar_senha" type="password" autocomplete="new-password" placeholder="Digite a senha novamente" required><button class="visibility-toggle" type="button" data-toggle-password aria-label="Mostrar senha">Ver</button></span></label><label class="terms"><input name="termos" type="checkbox" required><span>Concordo com o uso dos meus dados para acessar e utilizar o ReViva.</span></label><p class="feedback" id="registerError" role="alert" hidden></p><button class="button button-primary button-full" type="submit">Criar conta</button><p class="auth-switch">J&aacute; tem uma conta? <a href="index.html">Entrar</a></p></form></section></main><script type="module" src="js/auth.js"></script></body></html>
